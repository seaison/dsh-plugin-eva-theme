<script>
(async()=>{
const results=[];
const check=(name,ok,detail="")=>results.push({name,ok:!!ok,detail});
const wait=()=>new Promise(r=>setTimeout(r,50));
const exports=window.definition.factory(()=>{});

let balancePending=false, pendingSignal=null, mediaReads=0,lastMediaUrl='',mediaSignal=null;
let commandGate=null,readGate=null,commandFailure=null,readSnapshot=null;
const deferred=()=>{let resolve;const promise=new Promise(r=>{resolve=r});return {promise,resolve}};
const actions=[];
window.fetch=async(url,init={})=>{
 if(String(url).includes('balance')){
  if(balancePending)return new Promise((resolve,reject)=>{pendingSignal=init.signal;init.signal.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true})});
  return {ok:true,status:200,json:async()=>({ok:true,currency:'CNY',balance:12.34})};
 }
 if(init.method==='POST'){
  const body=JSON.parse(init.body);actions.push(body);
  const gate=commandGate;commandGate=null;if(gate)await gate.promise;
  if(commandFailure){const code=commandFailure;commandFailure=null;return {ok:false,status:409,json:async()=>({ok:false,code})}};
  if(body.action==='playpause'){external={...external,playing:!external.playing,state:external.playing?'paused':'playing'}}
  else external={...external,title:body.action==='next'?'Next track':'Previous track'};
  return {ok:true,status:200,json:async()=>({ok:true})};
 }
 mediaReads++;lastMediaUrl=String(url);mediaSignal=init.signal;const snapshot=readSnapshot||{...external},gate=readGate;readSnapshot=null;readGate=null;if(gate)await gate.promise;
 return {ok:true,status:200,json:async()=>snapshot};
};
const ctx={
 effect(fn){const dispose=fn();effects.push(dispose);return dispose},
 inject(){},
 theme:{overrideTokens(_name,tokens){
  const paint=()=>{const mode=document.body.hasAttribute('data-ds-dark-theme')?'dark':'light';for(const [key,value]of Object.entries(tokens))document.body.style.setProperty(key,value[mode])};paint();
  const observer=new MutationObserver(paint);observer.observe(document.body,{attributes:true,attributeFilter:['data-ds-dark-theme']});
  return()=>{observer.disconnect();for(const key of Object.keys(tokens))document.body.style.removeProperty(key)}
 },setTheme(id){document.body.toggleAttribute('data-ds-dark-theme',id==='dark')}}
};
try{
localStorage.clear();sessionStorage.clear();exports.apply(ctx);
const api=window.__EVA_MAGI_THEME__, layer=document.querySelector('.eva-magi-layer');
api.set('boot',false);

const controlSizes=controls.map(el=>({width:el.offsetWidth,height:el.offsetHeight}));
const menu=document.createElement('div');menu.className='fixture-menu';menu.setAttribute('role','menu');menu.setAttribute('data-menu-material','');menu.innerHTML='<button role="menuitem">选择模型</button>';document.body.appendChild(menu);

 canvas:getComputedStyle(document.body).backgroundColor,

for(const dark of [false,true,false,true]){

 const pilotName=layer.querySelector('.eva-pilot-name'),glyphs=[...name].map((_,i)=>{const range=document.createRange();range.setStart(pilotName.firstChild,i);range.setEnd(pilotName.firstChild,i+1);return range.getBoundingClientRect()});
 check(name+'：角色名字形使用统一中文字体且基线对齐',getComputedStyle(pilotName).fontFamily.startsWith('"Songti SC"')&&glyphs.every(r=>Math.abs(r.top-glyphs[0].top)<.5&&Math.abs(r.height-glyphs[0].height)<.5),JSON.stringify(glyphs.map(r=>({top:r.top,height:r.height}))));
 const running=document.querySelector('[data-chat-running]'),process=document.querySelector('.fixture-live-process'),accent=getComputedStyle(pilotName).color;
 const shimmerHex=exports.PALETTE['label-deep-diving-shimmer'][dark?1:0],shimmerColor='rgb('+[1,3,5].map(i=>parseInt(shimmerHex.slice(i,i+2),16)).join(', ')+')';

 check(name+'：角色点缀正确切换',getComputedStyle(layer.querySelector('.eva-character-art--'+art)).display!=='none'&&getComputedStyle(layer.querySelector('.eva-character-art--'+(dark?'rei':'asuka'))).display==='none');
 const portraitMask=getComputedStyle(layer.querySelector('.eva-character-portrait'),'::before').maskImage;
 check(name+'：左侧半身线稿随角色切换本地透明素材',portraitMask.includes('/dsh-eva-magi/assets/images/')&&portraitMask!==previousPortraitMask);previousPortraitMask=portraitMask;
 const a=getComputedStyle(controls[0]),b=getComputedStyle(controls[1]);
 check(name+'：权限和模型栏配色完全一致',a.color===b.color&&a.backgroundColor===b.backgroundColor&&a.boxShadow===b.boxShadow&&a.backgroundImage===b.backgroundImage);
 check(name+'：选择栏尺寸不变',controls.every((el,i)=>el.offsetWidth===controlSizes[i].width&&el.offsetHeight===controlSizes[i].height));
 check(name+'：全部界面及原位 portal 随角色换色',Object.entries(snap()).every(([k,v])=>dark?v===first[k]:v!==first[k]),JSON.stringify(snap()));
 check(name+'：切换不重建组件或重置尺寸',document.querySelector('.eva-magi-layer')===layer&&JSON.stringify(api.options)===JSON.stringify(switches));
}

check('设置面板独立挂载，装饰与排版默认折叠',settings.parentElement===layer&&!advanced.open);
// 计费状态直接驱动文字色；周末与假日均属于低谷。
const pricingTags=layer.querySelector('.eva-tags'),pricingState=pricingTags.dataset.state;
for(const dark of [true,false]){
 document.body.toggleAttribute('data-ds-dark-theme',dark);await wait();
 for(const state of ['peak','offhours','weekend','holiday']){
  pricingTags.dataset.state=state;
  const sample=document.createElement('span');sample.style.color='var(--dsw-alias-state-'+(state==='peak'?'error':'success')+'-primary)';sample.style.backgroundColor='var(--dsw-alias-bg-layer-1)';document.body.appendChild(sample);
  const expected=getComputedStyle(sample).color;
  const stateLabel=getComputedStyle(pricingTags.querySelector('.eva-tag--state'));
  check((dark?'明日香':'绫波丽')+' / '+state+'：状态与倒计时文字按峰红谷绿配色',stateLabel.color===expected&&getComputedStyle(pricingTags.querySelector('.eva-tag--remain')).color===expected);
  check((dark?'明日香':'绫波丽')+' / '+state+'：状态底色保持中性以承托文字',stateLabel.backgroundColor===getComputedStyle(sample).backgroundColor);
  sample.remove();
 }
}
pricingTags.dataset.state=pricingState;
document.body.setAttribute('data-ds-dark-theme','');await wait();
// 复现远程控制的嵌套对话框保护：多于一个 role=dialog 时拒绝关闭。
for(const dark of [true,false]){
 document.body.toggleAttribute('data-ds-dark-theme',dark);await wait();
 for(const settingsOpen of [false,true]){
  if(settings.hidden===settingsOpen)layer.querySelector('.eva-hud').click();
  const remote=document.createElement('div');
  remote.setAttribute('role','dialog');remote.setAttribute('aria-modal','true');remote.setAttribute('aria-label','远程控制');
  remote.style.cssText='position:fixed;left:10px;top:10px;z-index:100;width:240px;height:120px;background:var(--dsw-alias-bg-overlay);padding:12px';
  remote.innerHTML='<button type="button" aria-label="关闭远程控制">×</button>';
  const close=remote.querySelector('button');
  close.addEventListener('click',()=>{if(document.querySelectorAll('[role="dialog"]').length>1)return;remote.remove()});
  document.body.appendChild(remote);await wait();
  const name=(dark?'明日香':'绫波丽')+' / 设置'+(settingsOpen?'展开':'收起');
  check(name+'：远程控制是唯一宿主对话框',document.querySelectorAll('[role="dialog"]').length===1);
  check(name+'：模态弹窗打开时皮肤、立绘和交互组件暂时隐藏',getComputedStyle(layer).visibility==='hidden'&&getComputedStyle(layer.querySelector('.eva-hud')).visibility==='hidden'&&getComputedStyle(layer.querySelector('.eva-character-portrait')).visibility==='hidden');
  const box=close.getBoundingClientRect(),hit=document.elementFromPoint(box.left+box.width/2,box.top+box.height/2);
  check(name+'：叉号按钮可接收实际坐标处点击',hit===close||close.contains(hit));
  close.click();await wait();
  check(name+'：叉号正常关闭并恢复皮肤且保留设置状态',!remote.isConnected&&getComputedStyle(layer).visibility==='visible'&&settings.hidden!==settingsOpen);
 }
 settings.querySelector('.eva-panel-close').click();
}
document.body.setAttribute('data-ds-dark-theme','');await wait();
check('尺寸滑杆已移除（四角缩放替代）',!settings.querySelector('[data-key="hudScale"],[data-key="clockScale"]'));
await wait();
check('恢复默认后时钟与仪表实际宽度一致',Math.abs(layer.querySelector('.eva-clockpanel').getBoundingClientRect().width-layer.querySelector('.eva-hud').getBoundingClientRect().width)<.1);

const background=layer.querySelector('.eva-emg'),portraitNode=layer.querySelector('.eva-character-portrait');
api.set('wallpaper',false);check('背景开关同时隐藏角色半身线稿',getComputedStyle(background).display==='none');
api.set('wallpaper',true);api.set('wallpaperStrength',0);check('背景强度为零时半身线稿与几何背景一同透明',getComputedStyle(background).opacity==='0');
api.set('wallpaperStrength',.5);
check('半身线稿不拦截点击且不进入辅助技术阅读流',getComputedStyle(portraitNode).pointerEvents==='none'&&Boolean(portraitNode.closest('[aria-hidden="true"]')));

check('开机播放中切换角色不重启 GIF',!boot.querySelector('.eva-boot-console')&&getComputedStyle(boot).backgroundColor==='rgb(0, 1, 1)'&&boot.querySelector('img')===gif&&gif.naturalWidth===256);

api.set('boot',false);check('关闭开机序列移除 GIF 而非只隐藏',!document.querySelector('.eva-boot')&&!gif.hasAttribute('src'));
const completed=[...document.querySelectorAll('[data-turn-process]')];
check('已完成用时栏在类名变化及禁用状态下仍有警戒线',completed.every(el=>getComputedStyle(el).backgroundImage.includes('repeating-linear-gradient')&&getComputedStyle(el).backgroundSize==='100% 5px'));
check('警戒线不改变完成按钮高度',completed.every(el=>Math.abs(el.getBoundingClientRect().height-33)<.1));
completed[0].addEventListener('click',()=>completed[0].toggleAttribute('data-open'));completed[0].click();
check('警戒线保留任务过程按钮的折叠交互',completed[0].hasAttribute('data-open')&&!completed[0].disabled);
check('测绘网格和顶边压力线从界面与选项移除',!layer.querySelector('.eva-magi-grid,.eva-magi-top')&&!layer.querySelector('.eva-row[data-key="grid"],.eva-row[data-key="topLine"]')&&!Object.hasOwn(api.options,'grid')&&!Object.hasOwn(api.options,'topLine'));

const visible=el=>el && getComputedStyle(el).display!=='none' && el.getBoundingClientRect().width>0;
const rect=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
const inside=r=>r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1;
const validate=(name)=>{

 const hudScale=Number(layer.style.getPropertyValue('--eva-hud-scale')), clockScale=Number(layer.style.getPropertyValue('--eva-clock-scale'));
